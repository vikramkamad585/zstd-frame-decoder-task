[task]
name = "afterquery/zstd-frame-decoder"
description = "Implement a Zstandard (RFC 8878) codec in std-only Rust: a complete, strict decoder and an encoder scored on compression ratio against a near-zstd -19 reference."

[metadata]
paradigm = "implementation"
compute = "cpu"
languages = ["rust"]
category = "compression"
difficulty = "frontier"
tags = ["zstd", "rfc8878", "entropy-coding", "huffman", "fse", "lz77", "optimal-parsing", "rust"]
oracle_reward_threshold = 1.0

[agent]
timeout_sec = 28800

[verifier]
timeout_sec = 7200

[environment]
allow_internet = false
cpus = 8
memory_mb = 8192
gpus = 0

[environment.env]
TASK_BUDGET_SECS = "28800"
